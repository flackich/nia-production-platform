server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 64k;
    resolver 127.0.0.11 valid=10s;
    set $api http://api:5000;
    location = /health { access_log off; return 200 'ok'; }
    location /api/ { proxy_pass $api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Real-IP $remote_addr; }
    location /static/ { alias /usr/share/nginx/html/; }
    location / { try_files $uri $uri/ /index.html; }
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
}
