name: roman-production
services:
  frontend:
    image: production-frontend:local
    build: ./frontend
    ports: ['127.0.0.1:8080:8080']
    networks: [edge]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:8080/health']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  api:
    image: production-api:local
    build: ./app
    environment: &app_env
      DB_PASSWORD: ${DB_PASSWORD:?Run python scripts/setup.py first}
      SECRET_KEY: ${SECRET_KEY:?Run python scripts/setup.py first}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-DemoAdmin-2026!}
      MASTER_PASSWORD: ${MASTER_PASSWORD:-DemoMaster-2026!}
      VIEWER_PASSWORD: ${VIEWER_PASSWORD:-DemoView-2026!}
      REDIS_URL: redis://redis:6379/0
      SEED_DEMO: '1'
    networks: [edge, backend, observability]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request;urllib.request.urlopen('http://127.0.0.1:5000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 30s
    restart: unless-stopped
  worker:
    image: production-api:local
    build: ./app
    command: ['python', 'worker.py']
    environment: *app_env
    networks: [backend]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ['CMD', 'python', '-c', "import os,time,redis;r=redis.Redis.from_url(os.environ['REDIS_URL']);assert time.time()-float(r.get('production:worker') or 0)<20"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: production
      POSTGRES_DB: production
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U production -d production']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7.4.6-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    networks: [backend]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  monitoring:
    image: prom/prometheus:v3.7.3
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=3d']
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports: ['127.0.0.1:9090:9090']
    networks: [observability]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:9090/-/ready']
      interval: 10s
      timeout: 3s
      retries: 8
    restart: unless-stopped
networks:
  edge: {}
  backend: {internal: true}
  observability: {internal: true}
volumes:
  pgdata: {}
  promdata: {}
